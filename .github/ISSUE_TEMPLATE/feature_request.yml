name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先描述**要解决的现场问题**，再谈具体做法——同样的问题往往有更简单的解法。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 现在是怎么做的？卡在哪里？多久遇到一次？
      placeholder: |
        我们一张标签要打 3 个不同仓库的料号，现在只能一个模板打一种，得来回切模板…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      placeholder: 希望某个元素能按字段值自动切换字体颜色/隐藏…
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你已经试过的替代方案（可选）
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围（可多选）
      options:
        - label: Excel 导入 / 数据处理
        - label: 标签设计（画布、元素、表格）
        - label: 打印（直连打印、打印预览、打印机状态）
        - label: 部署与升级（局域网、安装包、增量更新）
        - label: 文档与使用体验
